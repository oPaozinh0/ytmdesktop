name: CI

on:
  push:
    branches: [feature/adblock, main]
  pull_request:
    branches: [feature/adblock, main]

jobs:
  lint-and-typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxlint
      - run: pnpm typecheck
