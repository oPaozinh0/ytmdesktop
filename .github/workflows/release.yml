name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Check if release assets already exist
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' 2>$null | Select-String -SimpleMatch "Setup.exe"; then
            echo "skip=true" >> $env:GITHUB_OUTPUT
          else
            echo "skip=false" >> $env:GITHUB_OUTPUT
          fi
      - run: pnpm install --frozen-lockfile
        if: steps.release_check.outputs.skip != 'true'
      - run: pnpm exec oxlint
        if: steps.release_check.outputs.skip != 'true'
      - run: pnpm typecheck
        if: steps.release_check.outputs.skip != 'true'
      - run: pnpm make
        if: steps.release_check.outputs.skip != 'true'
      - name: Upload Release Assets
        if: steps.release_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          generate_release_notes: true
